# ----------------------------------------------------------------------------
# Lamagram nginx reverse proxy.
#
# - HTTP (80) redirects to HTTPS.
# - HTTPS (443) terminates TLS and routes:
#     /api/ws    -> backend (WebSocket upgrade)
#     /api/      -> backend (REST + uploads)
#     /          -> frontend (static React bundle)
#
# Replace `your-domain.com` with your real domain (or run the substitution
# via `envsubst` if you prefer to template this file from $DOMAIN).
# ----------------------------------------------------------------------------

upstream lamagram_backend {
    server backend:8001;
}

upstream lamagram_frontend {
    server frontend:80;
}

# --- HTTP -> HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Allow ACME http-01 challenges if you switch to certbot --webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 100MB user uploads + headroom.
    client_max_body_size 150M;

    # Long timeouts so voice/video uploads + WebSocket idle don't get cut off.
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;

    # Standard reverse-proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ---- WebSocket: must come BEFORE the generic /api/ block ---------------
    location /api/ws {
        proxy_pass http://lamagram_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ---- REST API + uploads ------------------------------------------------
    location /api/ {
        proxy_pass http://lamagram_backend;
    }

    # ---- React SPA ---------------------------------------------------------
    location / {
        proxy_pass http://lamagram_frontend;
    }
}
